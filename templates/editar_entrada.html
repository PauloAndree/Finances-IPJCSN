<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Entrada - Igreja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        } 
        input[type=number] {
            appearance: textfield;
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="container max-w-2xl mx-auto bg-white p-6 md:p-10 rounded-xl shadow-2xl">
        
        <header class="mb-8 flex justify-between items-center border-b pb-4">
            <h1 class="text-3xl font-extrabold text-green-700">Editar Entrada</h1>
            <a href="{{ url_for('entradas') | default('#') }}" class="text-sm font-semibold text-gray-600 hover:text-green-600 transition duration-300">
                &larr; Voltar
            </a>
        </header>

        <section class="p-6 bg-green-50 rounded-xl shadow-inner border border-green-200">
            <form method="POST" class="space-y-4">
                
                <div>
                    <label for="categoria_id" class="block text-sm font-medium text-gray-700 mb-1">Categoria da Entrada:</label>
                    <select id="categoria_id" name="categoria_id" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 shadow-sm">
                        {% for conta in contas_receita %}
                            <option value="{{ conta.codigo }}" {% if entrada.tipo == conta.codigo %}selected{% endif %}>{{ conta.codigo }} - {{ conta.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label for="forma_pagamento" class="block text-sm font-medium text-gray-700 mb-1">Forma de Pagamento:</label>
                    <select id="forma_pagamento" name="forma_pagamento" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 shadow-sm">
                        {% for forma in formas_pagamento %}
                            <option value="{{ forma }}" {% if entrada.forma_pagamento == forma %}selected{% endif %}>{{ forma }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="valor" class="block text-sm font-medium text-gray-700 mb-1">Valor (R$):</label>
                    <input type="number" id="valor" name="valor" step="0.01" required placeholder="0.00" value="{{ "%.2f"|format(entrada.valor) }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 shadow-sm">
                </div>
                
                <div>
                    <label for="data" class="block text-sm font-medium text-gray-700 mb-1">Data da Entrada:</label>
                    <input type="date" id="data" name="data" required value="{{ entrada.data.strftime('%Y-%m-%d') }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 shadow-sm">
                </div>

                <div>
                    <label for="descricao" class="block text-sm font-medium text-gray-700 mb-1">Descrição (Opcional):</label>
                    <input type="text" id="descricao" name="descricao" placeholder="Detalhes da entrada..." value="{{ entrada.descricao or '' }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 shadow-sm">
                </div>

                <div class="flex space-x-4 mt-6">
                    <button type="submit" class="flex-1 py-3 bg-green-600 text-white font-bold rounded-lg shadow-lg hover:bg-green-700 transition duration-300 transform hover:scale-[1.01] focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50">
                        Salvar Alterações
                    </button>
                    <a href="{{ url_for('entradas') }}" class="flex-1 py-3 bg-gray-500 text-white font-bold rounded-lg shadow-lg hover:bg-gray-600 transition duration-300 transform hover:scale-[1.01] text-center">
                        Cancelar
                    </a>
                </div>

            </form>
        </section>

    </div>
</body>
</html>
