{% extends "base.html" %}
{% block title %}Editar Conta{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto p-4 md:p-8">

    <header class="mb-8 flex justify-between items-center border-b pb-4">
        <h1 class="text-3xl font-extrabold text-brand-700">Editar Conta</h1>
        <a href="{{ url_for('contas') }}" class="text-sm font-semibold text-gray-600 hover:text-brand-600 transition duration-300">
            &larr; Voltar
        </a>
    </header>

    <section class="p-6 bg-brand-50 rounded-xl shadow-inner border border-brand-100">
        <form method="POST" class="space-y-4">

            <div>
                <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome:</label>
                <input type="text" id="nome" name="nome" required value="{{ conta.nome }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 shadow-sm">
            </div>

            <div>
                <label for="tipo" class="block text-sm font-medium text-gray-700 mb-1">Tipo:</label>
                <select id="tipo" name="tipo" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 shadow-sm">
                    <option value="caixa" {% if conta.tipo == 'caixa' %}selected{% endif %}>Caixa</option>
                    <option value="banco" {% if conta.tipo == 'banco' %}selected{% endif %}>Banco</option>
                </select>
            </div>

            <div>
                <label for="saldo_inicial" class="block text-sm font-medium text-gray-700 mb-1">Saldo Inicial (R$):</label>
                <input type="number" id="saldo_inicial" name="saldo_inicial" step="0.01" value="{{ "%.2f"|format(conta.saldo_inicial) }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 shadow-sm">
            </div>

            <div class="flex space-x-4 mt-6">
                <button type="submit" class="flex-1 py-3 bg-brand-600 text-white font-bold rounded-lg shadow-lg hover:bg-brand-700 transition">
                    Salvar Alterações
                </button>
                <a href="{{ url_for('contas') }}" class="flex-1 py-3 bg-gray-500 text-white font-bold rounded-lg shadow-lg hover:bg-gray-600 transition text-center">
                    Cancelar
                </a>
            </div>

        </form>
    </section>

</div>
{% endblock %}
