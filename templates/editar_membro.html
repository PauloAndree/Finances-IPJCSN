{% extends "base.html" %}
{% block title %}Editar Membro{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto p-4 md:p-8">

    <header class="mb-8 flex justify-between items-center border-b pb-4">
        <h1 class="text-3xl font-extrabold text-brand-700">Editar Membro</h1>
        <a href="{{ url_for('membros') }}" class="text-sm font-semibold text-gray-600 hover:text-brand-600 transition duration-300">
            &larr; Voltar
        </a>
    </header>

    <section class="p-6 bg-brand-50 rounded-xl shadow-inner border border-brand-100">
        <form method="POST" class="space-y-4">
            <div>
                <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome:</label>
                <input type="text" id="nome" name="nome" required value="{{ membro.nome }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 shadow-sm">
            </div>
            <div>
                <label for="cpf" class="block text-sm font-medium text-gray-700 mb-1">CPF (Opcional):</label>
                <input type="text" id="cpf" name="cpf" value="{{ membro.cpf or '' }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 shadow-sm">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail (Opcional):</label>
                <input type="email" id="email" name="email" value="{{ membro.email or '' }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 shadow-sm">
            </div>
            <div>
                <label for="telefone" class="block text-sm font-medium text-gray-700 mb-1">Telefone (Opcional):</label>
                <input type="text" id="telefone" name="telefone" value="{{ membro.telefone or '' }}" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500 shadow-sm">
            </div>
            <div class="flex space-x-4 mt-6">
                <button type="submit" class="flex-1 py-3 bg-brand-600 text-white font-bold rounded-lg shadow-lg hover:bg-brand-700 transition">
                    Salvar Alterações
                </button>
                <a href="{{ url_for('membros') }}" class="flex-1 py-3 bg-gray-500 text-white font-bold rounded-lg shadow-lg hover:bg-gray-600 transition text-center">
                    Cancelar
                </a>
            </div>
        </form>
    </section>

</div>
{% endblock %}
