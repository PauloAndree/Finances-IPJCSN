<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IPJCSN Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .msg {
            padding: 0.5rem;
            margin-top: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
        }
        .error {
            background-color: #fee2e2;
            color: #ef4444;
            border: 1px solid #fca5a5;
        }
        .success {
            background-color: #d1fae5;
            color: #10b981;
            border: 1px solid #6ee7b7;
        }

        .titulo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="login-container w-full max-w-sm bg-white p-8 md:p-10 rounded-xl shadow-2xl border-t-4 border-green-600">
        
        <h2 class="text-3xl font-extrabold text-green-600 text-center mb-7">
            <span class="titulo-container">
                <img src="{{ url_for('static', filename='igreja.png') }}" alt="Logo IPJCSN" class="w-25 h-10 mr-1">
                Sistema IPJCSN
            </span>
        </h2>
        
        <form method="POST" action="{{ url_for('login') | default('#') }}" class="space-y-4">
            <input 
                type="email" 
                name="email" 
                placeholder="E-mail" 
                required
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 shadow-sm transition duration-150"
            >
            
            <input 
                type="password" 
                name="senha" 
                placeholder="Senha" 
                required
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 shadow-sm transition duration-150"
            >
            
            <button 
                type="submit" 
                class="w-full py-3 bg-green-600 text-white font-bold rounded-lg shadow-lg hover:bg-green-700 transition duration-300 transform hover:scale-[1.02] focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50"
            >
                Entrar
            </button>
        </form>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                <div class="mt-4 space-y-2">
                    {% for categoria, msg in mensagens %}
                        <p class="msg {{ categoria }}">{{ msg }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
    </div>

</body>
</html>
