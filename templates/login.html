{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white p-8 md:p-10 rounded-xl shadow-2xl border-t-4 border-green-600">

        <h2 class="text-2xl md:text-3xl font-extrabold text-green-600 text-center mb-7">
            <span class="flex flex-col items-center justify-center gap-2">
                <img src="{{ url_for('static', filename='igreja.png') }}" alt="Logo IPJCSN" class="w-16 h-16 object-contain">
                <span>Sistema IPJCSN</span>
            </span>
        </h2>

        <form method="POST" action="{{ url_for('login') | default('#') }}" class="space-y-4">
            <input
                type="email"
                name="email"
                placeholder="E-mail"
                required
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 shadow-sm transition duration-150"
            >

            <input
                type="password"
                name="senha"
                placeholder="Senha"
                required
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 shadow-sm transition duration-150"
            >

            <button
                type="submit"
                class="w-full py-3 bg-green-600 text-white font-bold rounded-lg shadow-lg hover:bg-green-700 transition duration-300 transform hover:scale-[1.02] focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50"
            >
                Entrar
            </button>
        </form>
    </div>
</div>
{% endblock %}
